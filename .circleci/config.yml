version: 2
jobs:
  build-job:
    parallelism: 1
    working_directory: ~/circleci/cablook-backend
    docker:
      - image: circleci/ruby:2.4.2-node
        environment:
          RAILS_ENV: test
          PGHOST: 127.0.0.1
          PGUSER: postgres
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: cablook_test
      - image: redis:2.8.19
    steps:
      - checkout
      # Restore bundle cache
      - type: cache-restore
        key: cablook-backend-{{ checksum "Gemfile.lock" }}
      # Bundle install dependencies
      - run: bundle install --path vendor/bundle
      # Store bundle cache
      - type: cache-save
        key: cablook-backend-{{ checksum "Gemfile.lock" }}
        paths:
          - vendor/bundle
      # Secrets setup
      - run: cp config/secrets.yml.example config/secrets.yml
      # Database setup
      - run: bundle exec rake db:create
      - run: bundle exec rake db:migrate
      # Run test
      - run:
          command: |
            mkdir /tmp/test-results
            bundle exec rspec --profile 10 \
                            --out /tmp/test-results/rspec.xml \
                            --format progress \
                            $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

  deploy-job:
    docker:
      - image: cablook-image
    working_directory: /tmp/my-project
    steps:
      - run:
          name: Run setup script
          command: bash .circleci/setup_staging.sh
      - add_ssh_keys:
          fingerprints:
            - "ed:8a:91:7c:a9:24:98:7b:f2:ef:dc:21:dd:32:16:4d"
      - run:
          name: Deploy Master to Heroku
          command: |
            git push --force git@heroku.com:$HEROKU_APP_NAME.git HEAD:refs/heads/master
            heroku run bundle exec rake db:migrate -a cabloook
            heroku restart
workflows:
  version: 2
  build-deploy:
   jobs:
     - build-job
     - deploy-job:
         requires:
           - build-job
         filters:
           branches:
             only: master
