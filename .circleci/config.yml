version: 2
jobs:
  build-job:
    parallelism: 1
    working_directory: ~/activebridge/cablook-backend
    docker:
      - image: circleci/ruby:2.4.2-node
        environment:
          RAILS_ENV: test
          PGHOST: 127.0.0.1
          PGUSER: postgres
      - image: circleci/postgres:9.5-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: cablook_test
      - image: redis:2.8.19
    steps:
      - checkout
      # Restore bundle cache
      - type: cache-restore
        key: cablook-backend-{{ checksum "Gemfile.lock" }}
      # Bundle install dependencies
      - run: bundle install --path vendor/bundle
      # Store bundle cache
      - type: cache-save
        key: cablook-backend-{{ checksum "Gemfile.lock" }}
        paths:
          - vendor/bundle
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ checksum "yarn.lock" }}
      - run:
          name: Install Dependencies
          command: yarn install
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      # Secrets setup
      - run: cp config/secrets.yml.example config/secrets.yml
      # Database setup
      - run: bundle exec rake db:create
      - run: bundle exec rake db:migrate
      # Run test
      - run:
          command: |
            mkdir /tmp/test-results
            bundle exec rspec --profile 10 \
                            --out /tmp/test-results/rspec.xml \
                            --format progress \
                            $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

  deploy-job:
    docker:
      - image: buildpack-deps:trusty
    steps:
      - checkout
      - run:
          name: Setup Heroku
          command: bash .circleci/setup-heroku.sh
      - add_ssh_keys:
          fingerprints:
            - "ed:8a:91:7c:a9:24:98:7b:f2:ef:dc:21:dd:32:16:4d"
            - "8b:48:5e:67:0e:c9:16:47:32:f2:87:0c:1f:c8:60:ad"   
      - run:
          name: Add Heroku to known_hosts
          command: ssh-keyscan -H heroku.com >> ~/.ssh/known_hosts

      - run:
          name: Deploy Master to Heroku
          command: |
            git remote add heroku https://git.heroku.com/cablook.git
            git push --force git@heroku.com:$HEROKU_APP_NAME.git HEAD:refs/heads/master
            heroku run rails db:migrate
            heroku restart
workflows:
  version: 2
  build-deploy:
   jobs:
     - build-job
     - deploy-job:
         requires:
           - build-job
         filters:
           branches:
             only: master
