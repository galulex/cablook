            Екологія може бути дешевою.
        eco:
          title: Екологічно
          description:
            В місті Черкаси на автомобільний транспорт припадає понад 20% викидів шкідливих речовин.
            Впоратися з цією проблемою можна за допомогою електрокарів, які мають 0-ву вихлопну емісію.
            Враховуючи цей факт, автопарк CabLook Taxi складається виключно з електрокарів.
            Ми допомагаємо зменшити шкідливе забруднення повітря від вихлопних газів - це наш внесок в здорове місто.

        comfort:
          title: Комфортно
          description:
            Електрокари - неодмінна умова комфортного майбутнього.
            Найкращим рішенням для подорожей по місту є Nissan LEAF - досить швидкий, спритний і тихий автомобіль.
            Авто цього класу підтримують бездротову мережу WiFi, просторі та легко можуть вмістити 4-х пасажирів з багажем.
        individual:
          title: Індивідуально
          description:
            Надаючи послуги таксі наша компанія дотримується правил win - win політики.
            Завдяки доброзичливим, кваліфікованим водіям; новим, чистим автомобілям та своєчасному наданню послуг пасажири оцінюють наш сервіс в середньому на 8.5 балів.
            Також додатковими опціями CabLook таксі є можливість заряджати пристрої та слухати улюблену музику впродовж усієї подорожі.
            CabLook таксі - безпрограшний варіант для кожного.
