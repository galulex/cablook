      title: Поширені запитання
      sections:
      - title: Акаунт і платіжні дані
        items:
          - question: Як змінити персональні дані профілю?
            answer:
              Під час реєстрації акаунта потрібно вказати лише номер вашого мобільного телефону, до якого прив'язана розрахункова карта.
              Змінити його не можливо. У разі заміни номера мобільного створюється новий акаунт.
          - question: Як змінити платіжні дані профілю?
            answer:
              Для зміни платежів необхідно зайти в розділ "Платежі" і надати інформацію про нову розрахункову карту.
              Після цього, під час замовлення послуги, у вас з'явиться можливість вибирати необхідний рахунок серед збережених.
          - question: Не можу змінити email
            answer: Адресу електронної пошти можливо змінити тільки у разі повторного додавання розрахункової карти, або заміні чинної.
          - question: Я не отримав (ла) рахунок про оплату, підтвердження оплати
            answer:
              Підтвердження оплати поїздки приходить на email, вказаний під час внесення платіжних даних.
              Якщо підтвердження не прийшло, перевірте правильність зазначеної email-адреси.
          - question: Чому мій платіж відхилено?
            answer: Платіж може бути відхилений лише в разі нестачі коштів на розрахунковій карті, що зазначена в системі.
          - question: Чи можлива оплата готівкою?
            answer: CabLook Taxi не підтримує систему готівкового розрахунку.
      - title: Реєстрація
        items:
          - question: Як створити CabLook Taxi акаунт?
            answer:
              Реєстрація в системі CabLook Taxi можлива через додаток.
              Для реєстрації необхідно ввести номер вашого телефону.
              Після чого система автоматично завантажує код верифікації, що був відправлений в смс і створює новий обліковий запис.
          - question: Помилка під час введення платіжних даних
            answer:
              Система CabLook Taxi перевіряє валідність інформації, що внесена в розділ "Платежі".
              Якщо ви отримали повідомлення про помилку, перевірте правильність внесених даних і наявність мінімальної суми на рахунку в розмірі 1UAH
          - question: Не прийшов код підтвердження реєстрації
            answer:
              Якщо система CabLook Taxi автоматично не завантажила код верифікації, що був відправлений у смс - спробуйте ввести його вручну.
              За відсутності смс із кодом перевірте правильність внесених даних.
          - question: Чому списується 1UAH у разі додавання розрахункової карти?
            answer:
              Сума в розмірі 1 UAH списується для підтвердження валідності розрахункової карти.
              Після підтвердження ця сума повертається назад на карту власника.
      - title: Навігація
        items:
          - question: Як замовити таксі?
            answer:
              Замовити таксі можна на сайті компанії та встановивши додаток CabLook Taxi.
              У разі підключення GPS вам необхідно ввести тільки адресу призначення в графу "Куди?" І натиснути кнопку "Поїхали"
          - question: Як дізнатися вартість поїздки?
            answer:
              Після того як ви ввели пункт призначення, система CabLook Taxi здійснює пошук оптимального маршруту і виводить повну вартість поїздки на екран.
          - question: Як розраховується вартість?
            answer: Вартість вказується в національній валюті та розраховується відповідно до цінової політики ТОВ CabLook Taxi
          - question: Де я можу переглянути інформацію про пересування таксі?
            answer:
              Щоби переглянути інформацію про пересування таксі та час прибуття до замовника, необхідно встановити додаток
          - question: Як скасувати поїздку?
            answer:
              Скасувати поїздку можливо до того моменту, поки система CabLook Taxi не прийняла заявку.
              Зазвичай, ця операція займає від 20 до 60 секунд.
              Якщо заявка прийнята, і водій вирушив до клієнта, скасувати заявку можливо, сплативши мінімальну вартість штрафу в розмірі 10 UAH.
      - title: Bonus +
        items:
          - question: Як діє система Bonus+?
            answer: Щоби скористатися бонусом і отримати безкоштовні поїздки, необхідно встановити додаток CabLook Taxi та розіслати промокод своїм знайомим.
          - question: Чи обмежена кількість осіб для поширення промокоду?
            answer: Не обмежена
          - question: Коли система Bonus + нараховує безкоштовні поїздки?
            answer: Безкоштовна поїздка нараховується за кожного знайомого, який отримав від вас промокод і скористався послугами CabLook Taxi.
          - question: Як я дізнаюся, що людина, яка отримала промокод скористалася ним і оплатила поїздку?
            answer:
              Щойно користувач, який отримав від вас промокод, оплатив послугу в системі CabLook Taxi,
              ви отримаєте email повідомлення про нарахування безкоштовної поїздки.
          - question: Чи обов'язково встановлювати додаток CabLook Taxi, щоб скористатися Bonus+?
            answer: Обов'язково. Оскільки переглянути промокод можливо тільки в додатку
      - title: Додатково
        items:
          - question: Упродовж якого часу приїжджає таксі?
            answer: Залежно від місцеперебування автомобіля в момент прийняття заявки. Зазавичай, час прибуття становить від 5 до 10 хвилин.
          - question: Чи потрібно доплачувати за багаж?
            answer: Ні. Багаж входить у вартість поїздки.
          - question: Чи є можливість зарядки мобільних пристроїв в автомобілі?
            answer: CabLook Taxi надає можливість зарядки мобільних пристроїв під час поїздки.
          - question: Куріння в салоні й розпивання алкогольних напоїв
            answer:
              Політика компанії CabLook Taxi клієнтоорієнтована і спрямована на надання комфортних умов поїздки всім своїм замовникам.
              З огляду на відгуки та потреби пасажирів розпивання спиртних напоїв і куріння в салоні заборонено.
          - question: Чи потрібно вносити дані що разу під час замовлення послуги?
            answer:
              Ні. Система запам'ятовує номер вашого мобільного телефону та автоматично завантажує всю необхідну інформацію.
