  welcome:
    title: 'CabLook Taxi - перше екологічне таксі у місті Черкаси'
    why: 'Ось чому:'
    logos:
      economy:
        title: 'Дешево'
        description: 'Ми впевнені, що Nissan - це глобальна революція у світі електрокарів. Тому CabLook таксі стала першою компанією таксі у місті Черкаси, що впровадила новаторські технології Nissan LEAF на практиці. Це дозволило нам скоротити витрати на утримування автопарку та понизити вартість послуг таксі. Екологія може бути дешевою.'
      eco:
        title: 'Екологічно'
        description: 'Таксі з двигуном внутрішнього згоряння виробляють в 4 рази більше CO2, ніж гібридні транспортні засоби. У Черкасах на автомобільний транспорт припадає 20% викидів шкідливих речовин. Впоратися з цією проблемою можна за допомогою EVs автомобілей. Вони відновлюють кінетичну енергію при гальмуванні й перетворюють її в електричну, в результаті чого викидів в атмосферу не відбувається. Враховуючи цю статистику, автопарк CabLook складається виключно з електромобілів. Це наш внесок в здорове місто.'
      comfort:
        title: 'Комфортно'
        description: 'Електричні транспортні засоби - неодмінна умова комфортного майбутнього. Найкращим рішенням для подорожей по місту є Nissan LEAF - досить швидкий, спритний і тихий автомобіль. Під час водіння електричний струм, що виробляється електрокаром, - лише шерех, викликаний опором повітря. Електрокари цього класу підтримують бездротову мережу WiFi, просторі та легко можуть вмістити 4-х пасажирів з багажем.'
      individual:
        title: 'Індивідуально'
        description: 'Надаючи послуги таксі наша компанія дотримується правил win - win політики. Завдяки доброзичливим, кваліфікованим водіям; новим, чистим автомобілям та своєчасному наданню послуг пасажири оцінюють наш сервіс в середньому на 8.5 балів. Також додатковою опцією CabLook таксі є можливість заряджати пристрої та слухати улюблену музику  впродовж усієї подорожі. CabLook таксі - безпрограшний варіант для кожного.'

