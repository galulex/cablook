    why: 'Вот почему:'
    logos:
      economy:
        title: 'Дешево'
        description: 'Наша компания уверена, что Nissan - это глобальная революция в сфере электромобилей. Поэтому CabLook Taxi - стала первой компанией такси в Черкассах, которая внедрила новаторские технологии Nissan LEAF в свою практику. Это позволило нам сократить расходы на содержание автопарка и снизить стоимость оказываемых услуг. Экология может быть недорогой.'
      eco:
        title: 'Экологично'
        description: 'Такси с двигателем внутреннего сгорания вырабатывают в 4 раза больше CO2, чем гибридные транспортные средства. В Черкассах на автомобильный транспорт приходится 20% выкидов вредных веществ. Справиться с этой проблемой можно посредствам EVs автомобилей. Они восстанавливают кинетическую энергию при торможении и превращают ее в электрическую, тем самым снижая на 100% уровень выхлопов в атмосферу. Учитывая данную статистику, автопарк CabLook состоит исключительно из электромобилей. Это наш вклад в здоровый город.'
      comfort:
        title: 'Комфортно'
        description: 'Электрические транспортные средства - неотъемлемая часть комфортного будущего. Хорошим решением для путешествий по городу является NIssan LEAF - достаточно быстрый, проворный и тихий автомобиль. Во время вождения электрический ток, вырабатываемый электрокаром -  всего лишь шорох, вызванный сопротивлением воздуха. Электрокары данного класса поддерживают беспроводную связь WiFi, просторны и легко могут вместить 4х пассажиров с багажом.'
      individual:
        title: 'Индивидуально'
        description: 'В своей работе мы придерживается win-win политики. Благодаря дружелюбным, квалифицированным водителям; новым, чистым автомобилям и своевременному оказанию услуг пассажиры оценивают наш сервис в среднем на 8.5 баллов. CabLook такси - беспроигрышный вариант для каждого.'
