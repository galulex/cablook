    faq:
      meta_title: 'Часто задаваемые вопросы | Каблук Такси'
      meta_description: 'Подборка часто задаваемых вопросов на счёт сервиса и работы приложения Каблук Такси'
      title: Часто задаваемые вопросы
      sections:
      - title: Аккаунт и платежные данные
        items:
          - question: Как изменить персональные данные профиля?
            answer:
                При регистрации аккаунта нужно указать только номер вашего мобильного телефона, к которому привязана расчетная карта.
                Изменить его нельзя. В случае замены номера мобильного создается новый аккаунт.
          - question: Как изменить платежные данные профиля?
            answer:
              Для изменения платежей необходимо зайти в раздел «Платежи» и предоставить информацию о новой расчетной карту.
              После этого, при заказе услуги, у вас появится возможность выбирать необходимый счет среди сохранившихся.
          - question: Не могу изменить email
            answer: Адрес электронной почты возможно изменить только в случае повторного добавления расчетной карты или замене действующей.
          - question: Я не получил (а) счет об оплате, подтверждение оплаты
            answer:
              Подтверждение оплаты поездки приходит на email, указанный при внесении платежных данных.
              Якщо підтвердження не прийшло, перевірте правильність зазначеної email-адреси.
          - question: Почему мой платеж отклонен?
            answer: Платеж может быть отклонен только в случае недостатка средств на расчетной карте, указанной в системе.
          - question: Возможна оплата наличными?
            answer: CabLook Taxi не поддерживает систему наличного расчета.
      - title: Регистрация
        items:
          - question: Как создать CabLook Taxi аккаунт?
            answer:
              Регистрация в системе CabLook Taxi возможна через приложение.
              Для регистрации необходимо ввести номер телефона.
              После чего система автоматически загружает код верификации, который был отправлен в смс и создает новую учетную запись.
          - question: Ошибка ввода платежных данных
            answer:
              Система CabLook Taxi проверяет валидность информации, внесенной в раздел «Платежи».
              Если вы получили сообщение об ошибке, проверьте правильность внесенных данных и наличие минимальной суммы на счете в размере 1UAH
          - question: Не пришел код подтверждения регистрации
            answer:
              Если система CabLook Taxi автоматически не загрузили код верификации, который был отправлен в смс - попробуйте ввести его вручную.
              При отсутствии смс с кодом проверьте правильность внесенных данных.
          - question: Почему списывается 1UAH при добавлении расчетной карты?
            answer:
              Сумма в размере 1 UAH списывается для подтверждения валидности расчетной карты.
              После подтверждения эта сумма возвращается обратно на карту владельца.
      - title: Навигация
        items:
          - question: Как заказать такси?
            answer:
              Заказать такси можно на сайте компании и установив приложение CabLook Taxi.
              При подключении GPS вам необходимо ввести только адрес назначения в графу "Куда?" И нажать кнопку "Поехали"
          - question: Как узнать стоимость поездки?
            answer:
              После того как вы ввели пункт назначения, система CabLook Taxi осуществляет поиск оптимального маршрута и выводит полную стоимость поездки на экран.
          - question: Как рассчитывается стоимость?
            answer: Стоимость указывается в национальной валюте и рассчитывается в соответствии с ценовой политики ООО CabLook Taxi
          - question: Где я могу посмотреть информацию о передвижении такси?
            answer:
              Чтобы просмотреть информацию о передвижении такси и время прибытия к заказчику, необходимо установить приложение
          - question: Как отменить поездку?
            answer:
              Отменить поездку возможно до того момента, пока система CabLook Taxi не приняла заявку.
              Обычно, эта операция занимает от 20 до 60 секунд.
              Если заявка принята, и водитель отправился к клиенту, отменить заявку возможно, заплатив минимальную стоимость штрафа в размере 10 UAH.
      - title: Bonus +
        items:
          - question: Как действует система Bonus +?
            answer: Чтобы воспользоваться бонусом и получить бесплатные поездки, необходимо установить приложение CabLook Taxi и разослать промокод своим знакомым.
          - question: Или ограниченное количество лиц для распространения промокод?
            answer: Не ограничено
          - question: Когда система Bonus + насчитывает бесплатные поездки?
            answer: Бесплатная поездка начисляется за каждого знакомого, который получил от вас промокод и воспользовался услугами CabLook Taxi.
          - question: Как я узнаю, что человек, получивший промокод воспользовалась им и оплатила поездку?
            answer:
              Как только пользователь, который получил от вас промокод, оплатил услугу в системе CabLook Taxi,
              вы получите email уведомления о начислении бесплатной поездки.
          - question: Обязательно устанавливать приложение CabLook Taxi, чтобы воспользоваться Bonus +?
            answer: Обязательно. Поскольку пересмотреть промокод возможно только в приложении
      - title: Дополнительно
        items:
          - question: В течение какого времени приезжает такси?
            answer: В зависимости от местонахождения автомобиля в момент принятия заявки. Обычно, время прибытия составляет от 5 до 10 минут.
          - question: Нужно ли доплачивать за багаж?
            answer: Нет. Багаж входит в стоимость поездки.
          - question: Есть ли возможность зарядки мобильных устройств в автомобиле?
            answer: CabLook Taxi предоставляет возможность зарядки мобильных устройств во время поездки.
          - question: Курение в салоне и распитие алкогольных напитков
            answer:
              Политика компании CabLook Taxi клиентоориентированная и направлена на предоставление комфортных условий поездки всем своим заказчикам.
              Учитывая отзывы и потребности пассажиров распитие спиртных напитков и курение в салоне запрещено.
          - question: Нужно ли вносить данные каждый раз при заказе услуги?
            answer:
              Нет. Система запоминает номер вашего мобильного телефона и автоматически загружает всю необходимую информацию.
