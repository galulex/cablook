en:
  authorizations:
    errors:
      invalid_username: Username is invalid
      invalid_password: Password is invalid
      invalid_phone_number: Phone number is invalid
  verifications:
    email:
      send_confirmation_token: "Confirmation link: %{token}. https://cablook.taxi"
      confirmation_subject: Email Confirmation
      already_confirmed: This email is already confirmed
    number:
      send_verification_token: "Verification cоdе: %{token}. https://cablook.taxi"
      send_retry_message: Dear client, you have unpaid trip. Pay the debt in our application.

    errors:
      invalid_or_expired: Verification token is invalid or expired. Try again.
      email:
        does_not_exist: A user with this email does not exist
      number:
        does_not_exist: A user with this phone number does not exist
  assignings:
    errors:
      messages:
        has_already_been_taken: This car has already been taken by another driver
  trips:
    assigned_or_canceled: Trip is taken already by another driver or canceled
    cancel_impossible: Impossible to cancel finished/canceled trip
    canceled: Trip successfully canceled
    invalid: Address is not correct
    invalid_preorder: Pre-order can be done in at least 30 minutes.
    pay_off_debt: Pay off debt for previous trips, please
    pending_trip_exists: There is one order already in progress
    start_at_invalid: Time entered incorrectly
    to_far: Distance too large
  cards:
    user_not_found: User with this phone number not found in database
    something_went_wrong: Something went wrong
    add_card: Please add a card before creating a trip
    cant_delete: You have a pending payments
  bonus_trips:
    disable_for_yourself: Can't create bonus trip for yourself
    already_have_referrer: You already have referrer
    no_available_bonus: You don't have available bonus trips or distance is more than 10km
  sms:
    car_found: "Car found. Wait at %{time}"
    payment_failed: Due to a lack of founds or internet limit you could not pay for the trip. You can pay the next time.
  business_mailer:
    receipt:
      subject: 'CabLook Business'
      user: 'User:'
      trip: 'Trip:'
      cost: 'Cost:'
      card: 'Card:'
  notification:
    car_not_found: No cars available right now.
    will_arrive: '%{name} on %{car} will arrive at %{time}'
    waiting: Driver is already waiting for you
  bot:
    request_contact:
      text: 'What is your phone number?'
      reply_markup:
        keyboard:
          -
            - text: Share my phone number
              request_contact: true
        one_time_keyboard: true
        resize_keyboard: true
    request_departure_address:
      text: 'Departure address?'
      reply_markup:
        remove_reply_keyboard:
          keyboard_remove: true
    book:
      text: 'Would you like to book a taxi?'
      reply_markup:
        inline_keyboard:
          -
            - text: Book
              callback_data: book
        remove_reply_keyboard:
          remove_keyboard: true
    send_location:
      reply_markup:
        inline_keyboard:
          -
            - text: 'Yes'
              callback_data: confirm_address
            - text: 'No'
              callback_data: reject_address
    done:
      text: Done
    incorect_address:
      text: Incorect Address
