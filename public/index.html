  <style type="text/css" media="screen">
    body::before, body::after {
      content: '';
      position: fixed;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
      background: url(https://i.imgur.com/cK8S0IY.jpg) repeat #243429;
    }

    body::after {
      background: linear-gradient(to bottom, rgba(57, 51, 89, 0.8), rgba(90, 174, 98, 0.8));
    }

    body {
      text-align: center;
      background: #171C18;
      color: white;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: Gilroy, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }

    main {
      position: relative;
      z-index: 10;
    }

    h1 {
      position: relative;
      z-index: 10;
      color: white;
      margin: 0;
    }

    span {
      font-weight: 100;
    }

    svg {
      max-width: 100%;
    }


    svg.icon path {
      fill:none;
      stroke: #FFFFFF;
      stroke-width: 7;
      stroke-miterlimit: 10;
    }

    svg.icon {
      max-width: 50px;
    }

    span {
      display: inline-block;
      vertical-align: top;
    }

    .logo {
      max-width: 300px;
    }

    button {
      background: #5AAE62;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 3px;
      padding: 0;
      vertical-align: middle;
      cursor: pointer;
    }

    input {
      border: none;
      font-size: 1.4rem;
      padding: 10px;
      background: transparent;
      color: #5AAE62;
      font-family: Gilroy;
      font-weight: 100;
      box-shadow: inset 1px 1px 3px black;
      border-top-left-radius: 5px;
      border-bottom-left-radius: 5px;
      width: 75vw;
      max-width: 450px;
      vertical-align: middle;
    }

    ::-webkit-input-placeholder { color: #5AAE62; }
    ::-moz-placeholder { color: #5AAE62; }
    :-ms-input-placeholder { color: #5AAE62; }
    :-moz-placeholder { color: #5AAE62; }

    .city {
      position: relative;
    }

    .car {
      position: absolute;
      top: 25%;
      width: 40%;
      left: 28.5%;
    }

    .sr0{ fill:#FFFFFF; }
    .sr1{ fill:#5AAE62; }
    .sr2{ font-weight: 700; }
    .sr3{ font-size: 24.9661px; }
    .sr4{ font-weight: 100; }

    @keyframes dash {
      to {
        stroke-dashoffset: -48;
      }
    }

    ellipse[stroke-dasharray] {
      stroke-dashoffset: 0;
      animation: dash .3s linear infinite;
    }
  </style>
