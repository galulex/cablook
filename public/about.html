    nav {
      position: fixed;
      width: 20%;
      background: #5da661;
      top: 0;
      bottom: 0;
      left: 0;
      transition: left .3s .1s;
    }

    nav a {
      color: white;
      font-weight: 400;
      display: block;
      padding: 10%;
      position: relative;
      text-decoration: none;
    }

    nav a:after {
      content: '';
      border-bottom: 2px solid white;
      width: 80%;
      position: absolute;
      bottom: 0;
      left: 10%;
    }

      margin-left: 20%;
      width: 80%;
      text-align: center;
      transition: margin-left .3s;
    }

    }

      position: fixed;
      left: 2%;
      transition: left .3s;
      cursor: pointer;
    }

    label[for='menu']:before {
      content: '☰';
      transition: all .3s;
      padding: 10px;
      color: #5da661;
      font-weight: 700;
      font-size: 2rem;
    }

    input#menu {
      opacity: 0;
      z-index: -1;
      position: absolute;
    }

    input#menu:checked ~ nav {
      left: 0;
      transition: left .3s;
    }

    input#menu:checked ~ main {
      margin-left: 42%;
    }

    input#menu:checked + label {
      left: 42%;
      transition: left .3s .1s;
    }

    input#menu:checked + label:before {
      content: '×';
      font-size: 3rem;
    }

    @media only screen and (max-width: 768px) {
